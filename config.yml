baseURL: https://cjbackman.com/
locale: en-us
title: Hej, I'm CJ.
theme: cjbackman

defaultContentLanguage: en

permalinks:
  posts: /on/:title/

pagination:
  pagerSize: 3

# Hugo Configure Markup
# More info: https://gohugo.io/getting-started/configuration-markup#
markup:
  highlight:
    guessSyntax: true
    style: emacs
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  # needed to render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
        enable: true

# Site parameters
params:
  author: cjbackman
  # Site description used in HTML meta
  description: Notes on engineering and leadership.

  social:
    email: mailto:cj@cjbackman.com
    linkedin: https://www.linkedin.com/in/cjbackman

  # Nav labels
  archive: Notes
  about: Notetaker
  nifties: Nifties

  # Giscus comments (GitHub Discussions). Fill repoId + categoryId from
  # https://giscus.app to enable. Opt out per post with `comments = false`
  # in frontmatter.
  giscus:
    repo: cjbackman/cjbackman.com
    repoId: "MDEwOlJlcG9zaXRvcnkxNDA5NTY4NTU="
    category: General
    categoryId: "DIC_kwDOCGbUt84C8MVX"
    mapping: pathname
    inputPosition: bottom
    theme: light
    lang: en
