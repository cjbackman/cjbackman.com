baseURL: https://cjbackman.com/
languageCode: en-us
title: Hej, I'm CJ.
theme: cjbackman

defaultContentLanguage: en

permalinks:
  posts: /on/:title/

pagination:
  pagerSize: 3

# Hugo Configure Markup
# More info: https://gohugo.io/getting-started/configuration-markup#
markup:
  highlight:
    guessSyntax: true
    style: emacs
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  # needed to render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
        enable: true

# Site parameters
params:
  author: cjbackman
  # Site description used in HTML meta
  description: Notes on engineering and leadership.

  social:
    email: mailto:cj@cjbackman.com
    linkedin: https://www.linkedin.com/in/cjbackman

  # Enable math typesetting (MathJax v4)
  math: true

  # Nav labels
  archive: Notes
  about: Notetaker
  nifties: Nifties

  customCSS:
    - css/custom.css
