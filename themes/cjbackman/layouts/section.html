{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <section class="archive">
    {{ range .Pages.GroupByDate "2006" }}
      <h2>{{ .Key }}</h2>
      <ul>
        {{ range .Pages }}
          <li>
            <time datetime="{{ .Date | time.Format "2006-01-02" }}">{{ .Date | time.Format "Jan 02" }}</time>
            <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </section>
{{ end }}
